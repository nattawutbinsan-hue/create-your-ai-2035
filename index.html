 if(m.locked)return `<div class="card c"><h2>🔒 AI ถูกล็อกแล้ว</h2><p class="mu">รอทีมอื่นและ Host เริ่ม Simulation</p>${bars(m)}</div>`;
 const rem=100-D.stats.reduce((a,b)=>a+b,0);
 return `<div class="card c"><h2>BUILD YOUR AI</h2><div class="code" style="font-size:40px;letter-spacing:0;color:${rem<0?'var(--ac)':'var(--ac2)'}">${rem}</div><div class="mu">Remaining PTS</div></div><div class="card">${ST.map((s,i)=>`<div class="row"><span style="flex:1;cursor:pointer" onclick="D.open=D.open===${i}?-1:${i};render()">${s}</span><button class="g" onclick="adj(${i},-5)">−</button><span class="n">${D.stats[i]}</span><button onclick="adj(${i},5)">+</button></div>${D.open===i?`<div class="mu" style="margin:-4px 0 6px">💡 ${DS[i]}</div>`:''}`).join('')}<p class="mu">แตะชื่อความสามารถเพื่อดูคำอธิบาย · ครั้งละ 5 แต้ม · ไม่มี Build ที่ดีที่สุด</p><button class="big" ${rem===0?'':'disabled'} onclick="saveMe({stats:D.stats,locked:true})">🔒 LOCK AI</button></div>`}
function adj(i,d){const v=D.stats[i]+d,rem=100-D.stats.reduce((a,b)=>a+b,0);if(v<0||(d>0&&rem<d))return;D.stats[i]=v;render()}
function reveal(){return teams().map(t=>`<div class="card"><h2>${esc(t.av)} ${esc(t.name)}</h2>${bars(t)}</div>`).join('')}
function timer(){const r=Math.max(0,(S.end-now())/1000);return `<div class="tmr"><b id="tn">${Math.ceil(r)}</b><div class="bar"><i id="tb" style="width:${Math.min(100,r/S.dur*100)}%"></i></div></div>`}
function play(){const s=SC[S.sc],m=me(),a=m&&(m.ans||{})[S.sc],tw=S.step==='twist',res=S.step==='result';
 let h=`<div class="card"><span class="pill">ข้อ ${S.sc+1}/${SC.length}</span>${res?'':timer()}<div class="pic"><span>${s.ic}</span>${s.img?`<img src="${esc(s.img)}" alt="" onerror="this.remove()">`:''}</div><h2>${s.t}</h2><p>${s.q}</p>`;
 if(res){return h+'</div><div class="card"><h2>📊 ผลคะแนนข้อนี้</h2><div class="sc"><table><tr><th>ทีม</th><th>เลือก</th><th>AI</th><th>ตัดสินใจ</th><th>⚡เร็ว</th><th>รวม</th></tr>'+teams().map(t=>{const x=score(t,S.sc),a=(t.ans||{})[S.sc]||{};return `<tr><td>${esc(t.av)} ${esc(t.name)}</td><td>${a.c2||a.c||'–'}</td><td>${x.c}</td><td>${x.d}</td><td>+${x.s}</td><td><b>${x.t}</b></td></tr>`}).join('')+`</table></div></div><div class="card">${board()}</div>`}
 if(tw)h+=`<div class="card tw" style="margin:0 0 10px;box-shadow:3px 3px 0 var(--ink)">🚨 <b>สถานการณ์เร่งด่วน!</b><br>${s.tw}<br><b>เปลี่ยนการตัดสินใจหรือไม่?</b></div>`;
 if(isHost)return h+Object.entries(s.o).map(([k,v])=>`<div class="opt" style="padding:10px;border:2px solid var(--ink);border-radius:10px"><b>${k}</b> ${v}</div>`).join('')+'</div>';
 if(!m)return h+'</div>';
 const cur=D.sel??(tw?(a&&(a.c2||a.c)):a&&a.c),locked=!tw&&a,wait=tw&&a&&a.c2,over=now()>S.end;
 h+=Object.entries(s.o).map(([k,v])=>`<button class="opt ${cur===k?'on':''}" ${locked||wait||over?'disabled':''} onclick="D.sel='${k}';render()"><b>${k}</b> ${v}</button>`).join('');
 if(locked||wait)return h+`<p class="c mu">✅ ส่งคำตอบแล้ว — รอ Host</p></div>`;
 if(over)return h+`<p class="c"><b>⏰ หมดเวลา</b></p></div>`;
 return h+`<button class="big" style="margin-top:10px" ${cur?'':'disabled'} onclick="submit(${tw})">ส่งคำตอบ</button></div>`}
function submit(tw){if(now()>S.end+500)return alert('หมดเวลาแล้ว');const ans={...(me().ans||{})},a=ans[S.sc]||{};if(tw)a.c2=D.sel||a.c;else{a.c=D.sel;a.t1=now()-S.t0}ans[S.sc]=a;D.sel=null;saveMe({ans})}
function final(){const r=ranked(),t=teams(),mx=k=>{const m=Math.max(...t.map(x=>x.stats[k]));return t.filter(x=>x.stats[k]===m)};
 const aw=[['🧠 Smartest AI',mx(0)],['🛡️ Safest AI',mx(2)],['🤝 Best Human-AI Collaboration',mx(4)]];
 return `<div class="card c"><h2>🏆 AI OF 2035</h2>${r.slice(0,3).map((x,k)=>`<div style="font-size:${26-k*3}px">${['🥇','🥈','🥉'][k]} ${esc(x.av)} <b>${esc(x.name)}</b> — ${total(x)}</div>`).join('')}</div><div class="card">${board()}</div>
 <div class="card">${aw.map(([n,x])=>`<div class="row"><b style="flex:1">${n}</b><span>${x.map(y=>esc(y.av)+' '+esc(y.name)).join(', ')}</span></div>`).join('')}</div>
 <div class="card"><h2>📋 เกณฑ์การให้คะแนน</h2><ul><li><b>คะแนน AI (สูงสุด 70)</b> — ค่าความสามารถที่คุณจัดสรรไว้ ตรงกับสิ่งที่สถานการณ์นั้นต้องการมากแค่ไหน</li><li><b>คะแนนตัดสินใจ (สูงสุด 30)</b> — วัดจากตัวเลือกสุดท้ายหลังสถานการณ์เร่งด่วน</li><li><b>คะแนนความเร็ว (สูงสุด 5)</b> — ตอบเร็วสุดได้ 5 เร็วรองลงมาได้ 4, 3, 2, 1 ตามลำดับ</li><li>รวมสูงสุดข้อละ 105 คะแนน · ทั้งหมด ${SC.length} ข้อ</li><li>รางวัลพิเศษ 3 แบบ ตัดสินจากค่าความสามารถที่ตั้งไว้ ไม่ใช่จากคะแนนรวม</li></ul></div>
 <div class="card c"><h2>THE FUTURE IS NOT ABOUT AI REPLACING HUMANS</h2><p>It's about how humans choose to build and control AI.</p><p class="mu">“AI ที่ดีที่สุดในปี 2035 อาจไม่ใช่ AI ที่ฉลาดที่สุด แต่คือ AI ที่สมดุลระหว่าง Intelligence, Safety และ Human Control”</p></div>`}
function render(){const el=$('#app');if(!db){el.innerHTML='<h1>CREATE YOUR AI<br>2035</h1><div class="card c">ยังไม่ได้ตั้งค่า Firebase</div>';return}
 const f=document.activeElement,id=f&&f.id,pos=f&&f.selectionStart;
 el.innerHTML=`<h1>🤖 CREATE YOUR AI<br>2035</h1>`+hostBar()+{lobby,build,reveal,play,final}[S.phase]();
 if(id&&$('#'+id)){$('#'+id).focus();try{$('#'+id).setSelectionRange(pos,pos)}catch(e){}}}
setInterval(()=>{if(S.phase!=='play'||!S.end||S.step==='result')return;const r=Math.max(0,(S.end-now())/1000),n=$('#tn');
 if(n){n.textContent=Math.ceil(r);$('#tb').style.width=Math.min(100,r/S.dur*100)+'%'}
 const k=S.sc+S.step;if(r<=0&&D.ex!==k){D.ex=k;render()}},250);
(function(){try{if(!FB.apiKey)return render();
firebase.initializeApp(FB);db=firebase.database();
db.ref('.info/serverTimeOffset').on('value',x=>off=x.val()||0);
isHost=location.hash==='#host';
uid=localStorage.getItem('uid')||('u'+Math.random().toString(36).slice(2,10));localStorage.setItem('uid',uid);
db.ref('game/state').on('value',x=>{const v=x.val();if(v){S=v;if(S.phase==='play'&&D.k!==S.sc+S.step){D.k=S.sc+S.step;D.sel=null}}else if(isHost){S.code=Math.random().toString(36).slice(2,7).toUpperCase();db.ref('game/state').set(S)}render()});
db.ref('teams').on('value',x=>{T=x.val()||{};render()});}catch(e){console.error(e);render()}})();
render();
</script></body></html>
